    <circle cx="34" cy="-25" r="19" fill="#fffaf3"/>
    <!-- crumb dots from the bite -->
    <circle cx="20" cy="-42" r="3.5" fill="#e8622c"/>
    <circle cx="10" cy="-49" r="2.5" fill="#e8622c"/>
    <!-- steam rising from the plate -->
